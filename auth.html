<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول / إنشاء الحساب</title>
  
  <!-- ✅ مكتبة Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"  rel="stylesheet">

  <!-- مسارات محلية إن وجدت -->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
  <link rel="stylesheet" href="assets/css/all.min.css">
</head>
<body class="bg-light">

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a href="" class="navbar-brand d-flex align-items-center">
          <img src="imag/AFA_logo.svg.png" width="40" height="40" class="rounded-circle me-2 border border-light" alt="">
          <span>lionel Messi</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-label="false">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse " id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="index2.html" class="nav-link active">HOME <i class="fas fa-home"></i></a></li>
                <li class="nav-item"><a href="me.html" class="nav-link">who we are <i class="fas fa-info-circle"></i></a></li>
                <li class="nav-item"><a href="photo.html" class="nav-link">photo <i class="fas fa-image"></i></a></li>
                <li class="nav-item"><a href="auth.html" class="nav-link">create account <i class="fas fa-user"></i></a></li>
                <li class="nav-item"><a href="cont.html" class="nav-link">contact us <i class="fas fa-envelope"></i></a></li>
            </ul>
        </div>
    </div>
  </nav>

  <!-- ✅ محتوى الصفحة -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="authTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">تسجيل الدخول</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">إنشاء حساب</button>
          </li>
        </ul>

        <!-- محتوى التبويبات -->
        <div class="tab-content" id="authTabContent">

          <!-- ✅ تبويب تسجيل الدخول -->
          <div class="tab-pane fade show active" id="login">
            <form class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="loginEmail" required>
                <div class="invalid-feedback">الرجاء إدخال بريد إلكتروني صالح.</div>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" id="loginPassword" required>
                <div class="invalid-feedback">الرجاء إدخال كلمة المرور.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">تسجيل الدخول</button>
            </form>
          </div>

          <!-- ✅ تبويب إنشاء حساب -->
          <div class="tab-pane fade" id="register">
            <form class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="regName" class="form-label">الاسم الكامل</label>
                <input type="text" class="form-control" id="regName" required>
                <div class="invalid-feedback">الرجاء إدخال الاسم الكامل.</div>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="regEmail" required>
                <div class="invalid-feedback">الرجاء إدخال بريد إلكتروني صالح.</div>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" id="regPassword" required minlength="6">
                <div class="invalid-feedback">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</div>
              </div>
              <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">تأكيد كلمة المرور</label>
                <input type="password" class="form-control" id="regConfirmPassword" required>
                <div class="invalid-feedback">كلمة المرور غير متطابقة.</div>
              </div>
              <button type="submit" class="btn btn-success w-100">إنشاء حساب</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Toast إشعار -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="loginToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          ✅ تم تسجيل الدخول بنجاح!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ كود التحقق + التوست -->
  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')

      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          const isRegister = form.closest('#register');

          // تحقق من كلمة المرور في إنشاء الحساب
          if (isRegister) {
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            if (password !== confirm) {
              document.getElementById('regConfirmPassword').setCustomValidity('كلمة المرور غير متطابقة');
            } else {
              document.getElementById('regConfirmPassword').setCustomValidity('');
            }
          }

          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          } else {
            event.preventDefault(); // منع الإرسال الفعلي
            form.classList.add('was-validated');

            // ✅ عرض Toast عند تسجيل الدخول فقط
            if (!isRegister) {
              const toastEl = document.getElementById('loginToast');
              const toast = new bootstrap.Toast(toastEl);
              toast.show();
            }
          }

        }, false);
      });
    })();
  </script>

</body>
</html>
