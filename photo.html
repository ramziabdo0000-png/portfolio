<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <title>Carousel صور</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 50px;
      text-align: center;
    }
    .carousel-container {
      width: 800px;
      margin: auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      background: white;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .carousel-item {
      min-width: calc(100% / 3); /* 3 صور تظهر في المرة الواحدة */
      box-sizing: border-box;
      padding: 10px;
    }
    .carousel-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 5px;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .buttons button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
    

  <div class="carousel-container">
    <div class="carousel-track" id="track">
      <div class="carousel-item"><img src="imag/97b55c146a1c0532f2f542b0e3aefd2c.jpg" alt=""></div>
      <div class="carousel-item"><img src="imag/2020px-FC_Barcelona_(crest).svg.png" alt=""></div>
      <div class="carousel-item"><img src="imag/a.jpg" alt=""></div>
      <div class="carousel-item"><img src="imag/cad217f24dad4198d8bfa4956dade234.jpg" alt=""></div>
      <div class="carousel-item"><img src="imag/a (2).jpg" alt=""></div>
    </div>
  </div>

  <div class="buttons">
    <button id="prevBtn">السابق</button>
    <button id="nextBtn">التالي</button>
  </div>

  <script>
    const track = document.getElementById('track');
    const items = document.querySelectorAll('.carousel-item');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const totalItems = items.length;
    const itemsToShow = 1; // عدد الصور المعروضة في كل مرة
    let currentIndex = 0;

    function updateCarousel() {
      const itemWidth = items[0].getBoundingClientRect().width;
      const moveX = currentIndex * itemWidth;
      track.style.transform = `translateX(-${moveX}px)`;
    }

    nextBtn.addEventListener('click', () => {
      if (currentIndex < totalItems - itemsToShow) {
        currentIndex++;
        updateCarousel();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCarousel();
      }
    });

    // اختياري: اجعل التنقل دائري
    // إذا تحب أفعّل لك دائري بحيث عند الأخير يعود للأول
  </script>

</body>
</html>
